<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Rate Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Gold Rate Calculator ✨</h1>
        <div class="input-group">
            <label for="gold-mcx-rate">Gold MCX Rate:</label>
            <input type="number" id="gold-mcx-rate" placeholder="e.g., 109260">
        </div>
        
        <div class="input-group">
            <label>*10 Value:</label>
            <input type="text" id="multiplied-value" readonly>
        </div>

        <div class="input-group">
            <label>Divide by:</label>
            <div class="radio-group">
                <input type="radio" id="divide-996" name="divide-option" value="0.996" checked>
                <label for="divide-996">0.996</label>
                <input type="radio" id="divide-995" name="divide-option" value="0.995">
                <label for="divide-995">0.995</label>
            </div>
        </div>
        
        <button onclick="calculate()">Calculate</button>
        
        <hr>

        <h2>Calculation Results</h2>
        <div class="result-group">
            <label>Divided Value:</label>
            <input type="text" id="divided-value" readonly>
        </div>
        <div class="result-group">
            <label>GST (3%):</label>
            <input type="text" id="gst-value" readonly>
        </div>
        <div class="result-group">
            <label>Delivery Charge:</label>
            <input type="text" id="delivery-charge" readonly>
        </div>
        <div class="result-group">
            <label for="brokerage">Brokerage (Dynamic):</label>
            <input type="number" id="brokerage" value="500" step="any" placeholder="Enter brokerage, e.g. 500">
        </div>
        <div class="result-group">
            <label>Fixed Delivery Charge:</label>
            <input type="text" id="fixed-delivery" value="295" readonly>
        </div>
        <div class="result-group total-value">
            <label>Total Value:</label>
            <input type="text" id="total-value" readonly>
        </div>
        <div class="result-group final-value">
            <label>Final Value:</label>
            <input type="text" id="final-value" readonly>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
