    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa7c11;
            --light-gold: #f3e5ab;
            --text-color: #2c2c2c;
            --bg-light: #faf9f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient animated background */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(250, 249, 246, 0.85), rgba(250, 249, 246, 0.92)), url('images/jewelry4.jpg');
            background-size: cover;
            background-position: center;
            transform: scale(1.05);
            animation: slowPan 30s infinite alternate ease-in-out;
        }

        @keyframes slowPan {
            0% {
                transform: scale(1.05) translate(0, 0);
            }

            100% {
                transform: scale(1.1) translate(-2%, -1%);
            }
        }

        /* Sparkle particles */
        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.8) 0%, rgba(212, 175, 55, 0) 70%);
            border-radius: 50%;
            animation: floatSparkle 8s infinite linear;
        }

        @keyframes floatSparkle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* Landing card container */
        .card-container {
            position: relative;
            z-index: 3;
            max-width: 600px;
            width: 90%;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(44, 44, 44, 0.05),
                0 1px 3px rgba(212, 175, 55, 0.1);
            text-align: center;
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Logo styling */
        .logo-wrap {
            margin-bottom: 25px;
            animation: scaleIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-img {
            height: 90px;
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(212, 175, 55, 0.15));
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Typographic hierarchy */
        .brand-subtitle {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--dark-gold);
            margin-bottom: 12px;
            display: inline-block;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 6px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .intro-text {
            font-size: 0.95rem;
            color: #5a5a5a;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Call to action buttons */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            padding: 15px 35px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.25);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        .btn-enter:hover::before {
            left: 100%;
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.35);
        }

        .btn-secondary {
            display: inline-block;
            font-size: 12px;
            color: #7a7a7a;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
            margin-top: 10px;
            border-bottom: 1px dashed #7a7a7a;
        }

        .btn-secondary:hover {
            color: var(--dark-gold);
            border-bottom-color: var(--dark-gold);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .card-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .intro-text {
                font-size: 0.85rem;

    <!-- Script to dynamically generate particles -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('sparkles-container');
            const sparkleCount = 15;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');

                // Random position & speed properties
                const size = Math.random() * 8 + 3;
                const left = Math.random() * 100;
                const delay = Math.random() * 8;
                const duration = Math.random() * 5 + 6;

                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${left}%`;
                sparkle.style.animationDelay = `${delay}s`;
                sparkle.style.animationDuration = `${duration}s`;

                container.appendChild(sparkle);
            }
        });
    </script>
